# Swap the running vLLM container with LLM_MODEL, then point this file at it.
# Do not add these choices to the Settings UI. Prod on-prem uses DHARA_LLM_*.
backends:
  - name: openai
    base_url: https://api.openai.com/v1
    model: gpt-4o-mini
    api_key_env: OPENAI_API_KEY
  - name: phi-4-mini-instruct
    base_url: http://127.0.0.1:8100/v1
    model: phi-4-mini-instruct
    api_key_env: DHARA_LLM_API_KEY
    notes: compose LLM_MODEL=phi-4-mini-instruct
  - name: gemma-3-4b
    base_url: http://127.0.0.1:8100/v1
    model: gemma-3-4b
    api_key_env: DHARA_LLM_API_KEY
    notes: compose LLM_MODEL=gemma-3-4b
  - name: gemma-2-9b-it
    base_url: http://127.0.0.1:8100/v1
    model: gemma-2-9b-it
    api_key_env: DHARA_LLM_API_KEY
    notes: Copy llm/gemma-3-4b to llm/gemma-2-9b-it, set LLM_MODEL, rebuild llm, then run.
